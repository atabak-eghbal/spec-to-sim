# Keep the public demo awake for judges: free Hugging Face Spaces sleep after 48 h without visitors.
# Pings the health endpoint every 6 hours (and on demand from the Actions tab).
name: keep demo awake
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the demo
        run: |
          for i in 1 2 3; do
            curl -fsS -m 120 https://austintransformer-spec-to-sim.hf.space/healthz && exit 0
            sleep 60   # a sleeping Space takes a minute or two to wake
          done
          exit 1
