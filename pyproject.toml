[project]
name = "spec2sim"
version = "0.1.0"
description = "Plain-English robot tasks -> self-repairing MuJoCo simulations, powered by NVIDIA Nemotron on Nebius Token Factory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "tavily-python>=0.5",
  "langsmith>=0.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "mujoco>=3.2",
  "mink>=0.0.5",
  "numpy>=1.26",
  "imageio[ffmpeg]>=2.34",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec2sim"]
